services:
  layout-api:
    profiles: ["prod", "dev"]
    build:
      context: .
      dockerfile: layout-api/Dockerfile
    image: ontology-layout-api:local
    container_name: ontology-layout-api
    environment:
      LAYOUTS_DIR: /data/layouts
    volumes:
      - ontology_layouts:/data/layouts
    restart: unless-stopped

  ontology-viewer:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ontology-viewer-service:local
    container_name: ontology-viewer-service
    ports:
      - "81:81"
    environment:
      ARCHES_MAP_BASE_URL: ${ARCHES_MAP_BASE_URL:?Set ARCHES_MAP_BASE_URL in .env}
      ARCHES_MAP_HOST_HEADER: ${ARCHES_MAP_HOST_HEADER:?Set ARCHES_MAP_HOST_HEADER in .env}
    restart: unless-stopped
    depends_on:
      - layout-api

  viewer-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    container_name: ontology-viewer-dev
    ports:
      - "81:81"
    volumes:
      - .:/app
      - ontology_viewer_node_modules:/app/node_modules
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 81"
    depends_on:
      - layout-api

volumes:
  ontology_layouts:
  ontology_viewer_node_modules: